name: Weekly digest
on:
  schedule:
    - cron: "0 13 * * 0" # Sundays 13:00 UTC — well after RepoRadar's daily run
  workflow_dispatch:
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/digest.js
      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "digest: week of $(date -u +%F)"
          git push
